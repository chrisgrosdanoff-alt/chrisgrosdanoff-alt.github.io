<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snake">
  <meta name="theme-color" content="#07080a">
  <title>Snake</title>
  <style>
    :root {
      --bg: #07080a;
      --panel: rgba(22, 24, 28, 0.82);
      --line: rgba(255,255,255,0.08);
      --text: #f4f6f8;
      --muted: #8b93a1;
      --accent: #3dff8a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; width: 100%; height: 100%; height: 100svh; overflow: hidden;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(61,255,138,0.12), transparent 50%), radial-gradient(800px 500px at 80% 110%, rgba(61,140,255,0.08), transparent 45%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }
    body {
      display: flex; flex-direction: column; gap: 12px;
      padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .pills { display: flex; gap: 8px; }
    .pill { min-width: 72px; padding: 8px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(16px); text-align: right; }
    .pill span { display: block; font-size: 9px; letter-spacing: 0.14em; color: var(--muted); }
    .pill b { font-size: 16px; font-variant-numeric: tabular-nums; }
    #boardWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .board { position: relative; border-radius: 24px; overflow: hidden; background: #101216; box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,0.35); }
    canvas { display: block; width: 100%; height: 100%; }
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(7,8,10,0.55); backdrop-filter: blur(8px); }
    #overlay.hidden { display: none; }
    .card { width: min(86%, 280px); padding: 22px 20px 18px; border-radius: 22px; background: rgba(18,20,24,0.92); border: 1px solid var(--line); text-align: center; }
    .card h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.03em; }
    .card p { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .primary { width: 100%; border: 0; border-radius: 14px; padding: 13px 16px; background: var(--accent); color: #062013; font-weight: 800; font-size: 15px; }
    #controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; flex-shrink: 0; padding-bottom: 4px; }
    .pad { width: 176px; height: 176px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; }
    .pad button, .ghost { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 22px; backdrop-filter: blur(16px); font-size: 18px; }
    .pad button:active, .ghost:active, .primary:active { transform: scale(0.97); }
    .pad .up { grid-column: 2; grid-row: 1; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 3; }
    .side { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .ghost { padding: 12px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">Snake</div>
    <div class="pills">
      <div class="pill"><span>SCORE</span><b id="score">0</b></div>
      <div class="pill"><span>BEST</span><b id="best">0</b></div>
    </div>
  </div>
  <div id="boardWrap">
    <div class="board" id="board">
      <canvas id="game" width="400" height="400"></canvas>
      <div id="overlay">
        <div class="card">
          <h1 id="title">Snake</h1>
          <p id="message">Eat the orbs. Don't hit yourself.</p>
          <button class="primary" id="startBtn">Play</button>
        </div>
      </div>
    </div>
  </div>
  <div id="controls">
    <div></div>
    <div class="pad">
      <button class="up" data-dir="0,-1">▲</button>
      <button class="left" data-dir="-1,0">◀</button>
      <button class="right" data-dir="1,0">▶</button>
      <button class="down" data-dir="0,1">▼</button>
    </div>
    <div class="side">
      <button class="ghost" id="pauseBtn">PAUSE</button>
      <button class="ghost" id="restartBtn">RESET</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const message = document.getElementById("message");
    const title = document.getElementById("title");
    const COLS = 18, ROWS = 18;
    let cell = 20, snake, dir, nextDir, food, score, best, paused, running, ignoreSwipe;
    best = Number(localStorage.getItem("snake-best-v2") || 0);
    bestEl.textContent = best;
    function resize() {
      const wrap = document.getElementById("boardWrap");
      const size = Math.max(180, Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight)));
      const board = document.getElementById("board");
      board.style.width = size + "px";
      board.style.height = size + "px";
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cell = size / COLS;
      draw();
    }
    function reset() {
      snake = [{x: 4, y: 9}, {x: 3, y: 9}, {x: 2, y: 9}];
      dir = {x: 1, y: 0};
      nextDir = {x: 1, y: 0};
      score = 0;
      scoreEl.textContent = "0";
      placeFood();
      paused = false;
      running = true;
      document.getElementById("pauseBtn").textContent = "PAUSE";
    }
    function placeFood() {
      do { food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)}; }
      while (snake.some(s => s.x === food.x && s.y === food.y));
    }
    function setDir(x, y) {
      if (!running || paused) return;
      if (dir.x + x === 0 && dir.y + y === 0) return;
      nextDir = {x, y};
    }
    function tick() {
      if (!running || paused) return;
      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10; scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem("snake-best-v2", best); }
        placeFood();
      } else snake.pop();
      draw();
    }
    function roundRect(x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function draw() {
      const size = cell * COLS;
      ctx.clearRect(0, 0, size, size);
      ctx.fillStyle = "#101216"; ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = "rgba(255,255,255,0.04)"; ctx.lineWidth = 1;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(size, i * cell); ctx.stroke();
      }
      if (!food || !snake) return;
      const fx = food.x * cell + cell / 2, fy = food.y * cell + cell / 2;
      ctx.beginPath(); ctx.fillStyle = "rgba(255,77,109,0.22)"; ctx.arc(fx, fy, cell * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.fillStyle = "#ff4d6d"; ctx.arc(fx, fy, cell * 0.22, 0, Math.PI * 2); ctx.fill();
      snake.forEach((s, i) => {
        const pad = i === 0 ? cell * 0.12 : cell * 0.18;
        ctx.fillStyle = i === 0 ? "#b6ffd0" : "#3dff8a";
        roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
        ctx.fill();
      });
    }
    function gameOver() {
      running = false; title.textContent = "Game over"; message.textContent = "Score " + score;
      document.getElementById("startBtn").textContent = "Play again"; overlay.classList.remove("hidden"); draw();
    }
    function start() {
      ignoreSwipe = true; reset(); overlay.classList.add("hidden"); draw();
      setTimeout(() => { ignoreSwipe = false; }, 250);
    }
    document.getElementById("startBtn").addEventListener("click", start);
    document.getElementById("restartBtn").addEventListener("click", start);
    document.getElementById("pauseBtn").addEventListener("click", () => {
      if (!running) return; paused = !paused;
      document.getElementById("pauseBtn").textContent = paused ? "RESUME" : "PAUSE";
    });
    document.querySelectorAll(".pad button").forEach(btn => {
      const [x, y] = btn.dataset.dir.split(",").map(Number);
      const go = e => { e.preventDefault(); setDir(x, y); };
      btn.addEventListener("touchstart", go, {passive: false});
      btn.addEventListener("mousedown", go);
    });
    window.addEventListener("keydown", e => {
      const map = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0]};
      const k = map[e.key] || map[e.key.toLowerCase()];
      if (k) { e.preventDefault(); setDir(k[0], k[1]); }
    });
    let sx, sy;
    document.addEventListener("touchstart", e => {
      if (e.target.closest("button")) { ignoreSwipe = true; return; }
      sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY;
    }, {passive: true});
    document.addEventListener("touchend", e => {
      if (ignoreSwipe) { ignoreSwipe = false; return; }
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) < 28 && Math.abs(dy) < 28) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
    }, {passive: true});
    setInterval(tick, 130);
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
